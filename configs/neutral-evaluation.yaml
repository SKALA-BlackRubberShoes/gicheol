# Deployment values must be explicitly supplied before validate/run succeeds.
# Precedence: CLI --set key=value > environment > this YAML. Paths use repository root.
run_config:
  supervisor_model: null # Optional compatibility field; routing is deterministic.
  research_model: null
  report_model: null
  judge_model: null
  embedding_model: BAAI/bge-m3
  embedding_revision: null # Set an immutable downloaded Hugging Face revision.
  embedding_dimension: 1024
  index_version: neutral-v2-1
  max_research_attempts_per_view: 3
  max_eligibility_attempts: 3
  max_quality_repairs: 2
  max_graph_steps: 60
  recursion_limit: 100
  run_deadline_seconds: 900
  tool_timeout_seconds: 30
  llm_timeout_seconds: 60
  max_transient_retries: 2
  max_sources_per_run: 40
  max_queries_per_view: 3
  top_k: 5
  chunk_tokens: 400
  chunk_overlap_tokens: 60
artifact_root: outputs/juhyeon
sqlite_path: outputs/juhyeon/checkpoints.sqlite
report_font_path: null # REPORT_FONT_PATH: explicit embeddable Korean TTF.
qdrant_url: null # QDRANT_URL, for example http://localhost:6333
qdrant_collection: null # New dedicated collection; never reuse the legacy 512-D index.
index_manifest_path: outputs/juhyeon/index-manifest.json
corpus_paths:
  - docs/data/market/raw/*.pdf
  - docs/data/technology_competition/raw/*.pdf
corpus_domains:
  - Physical AI / Robotics
# All real prompts used by the service factory must be listed here before running.
prompt_paths: []
search_provider: null
services_factory: main.runtime.neutral.services:unconfigured_services
langsmith_tracing: false
langsmith_project: neutral-evaluation-v2
credential_env_vars:
  - OPENAI_API_KEY
  - TAVILY_API_KEY
